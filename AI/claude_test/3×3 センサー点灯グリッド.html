<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, viewport-fit=cover">
<title>3×3 センサー点灯グリッド</title>
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--off:#111;--on:#22c55e;--err:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1a;--fg:#eee}}
:root[data-theme="dark"]{--bg:#1b1b1a;--fg:#eee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:16px;margin:4px 0 10px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(92vw,420px)}
.cell{aspect-ratio:1;border-radius:12px;background:var(--off);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:4px;transition:background .15s}
.cell b{font-size:11px;opacity:.7;font-weight:400}
.cell.on{background:var(--on);color:#04210f}
.cell.err{background:var(--err)}
.cell small{font-size:10px;opacity:.85;margin-top:2px}
#score{margin-top:14px;font-size:22px;font-weight:700}
#now{font-size:13px;opacity:.75;margin-top:2px}
button{margin-top:12px;padding:10px 16px;border-radius:10px;border:1px solid currentColor;background:none;color:inherit;font-size:14px}
p.note{font-size:11px;opacity:.65;max-width:420px;text-align:center}
</style>
</head>
<body>
<h1>3×3 センサー点灯グリッド</h1>
<div id="grid"></div>
<div id="score">最大緑点灯数 0/9</div>
<div id="now">現在 0/9</div>
<button id="perm">センサーを有効化</button>
<p class="note">緑=条件を満たす / 黒=満たさない / 赤=この端末では取得不可。位置情報・センサーの許可が必要です。</p>
<script>
const defs=[
 ["触れている間"],["緯度 小数第2位が偶数"],["バッテリー 80%以上"],
 ["振ってから5秒"],["南向き"],["横向き"],
 ["オフライン"],["Edge"],["拡大率 80%"]
];
const grid=document.getElementById('grid');
const cells=defs.map((d,i)=>{const e=document.createElement('div');e.className='cell';e.innerHTML='<b>('+Math.floor(i/3)+','+(i%3)+')</b>'+d[0]+'<small></small>';grid.appendChild(e);return e});
const t0=Date.now();
const S={touch:0,lat:null,geo:'pending',batt:undefined,shake:0,motion:false,heading:null,orient:false};

// (0,0) touch
const pts=new Set();
addEventListener('pointerdown',e=>{pts.add(e.pointerId);S.touch=pts.size});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,e=>{pts.delete(e.pointerId);S.touch=pts.size}));
addEventListener('touchend',e=>{if(e.touches.length===0){pts.clear();S.touch=0}});
addEventListener('contextmenu',e=>e.preventDefault());

// (0,1) geolocation
function startGeo(){
 if(!navigator.geolocation){S.geo='err';return}
 try{navigator.geolocation.watchPosition(p=>{S.lat=p.coords.latitude;S.geo='ok'},()=>{S.geo='err'},{enableHighAccuracy:true,maximumAge:2000})}catch(e){S.geo='err'}
}
startGeo();

// (0,2) battery
if(navigator.getBattery){
 navigator.getBattery().then(b=>{const u=()=>{S.batt=b.level};u();b.addEventListener('levelchange',u)}).catch(()=>{S.batt=null});
}else S.batt=null;

// (1,0) shake / (1,1) heading
let lastMag=null;
function onMotion(e){
 const a=e.accelerationIncludingGravity;
 if(!a||a.x==null)return;
 S.motion=true;
 const m=Math.hypot(a.x,a.y,a.z);
 if(Math.abs(m-9.8)>12||(lastMag!=null&&Math.abs(m-lastMag)>14))S.shake=Date.now();
 lastMag=m;
}
function onOrient(e){
 let h=null;
 if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
 else if(e.alpha!=null&&(e.absolute||e.type==='deviceorientationabsolute'))h=(360-e.alpha)%360;
 if(h!=null){S.heading=h;S.orient=true}
}
function listen(){
 addEventListener('devicemotion',onMotion);
 addEventListener('deviceorientationabsolute',onOrient);
 addEventListener('deviceorientation',onOrient);
}
listen();
document.getElementById('perm').addEventListener('click',async()=>{
 try{
  if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();
  if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();
 }catch(e){}
 startGeo();
});

// (2,2) zoom
function zoom(){
 const vv=window.visualViewport;
 const s=vv?vv.scale:1;
 if(!window.outerWidth||!window.innerWidth)return vv?s:null;
 return (window.outerWidth/window.innerWidth)*s;
}

function render(){
 const now=Date.now(),wait=now-t0>2000;
 const st=[];
 st.push(S.touch>0?1:0);
 // (0,1)
 if(S.geo==='err')st.push(2);
 else if(S.lat==null)st.push(0);
 else st.push(Math.floor(Math.abs(S.lat)*100)%10%2===0?1:0);
 // (0,2)
 st.push(S.batt===null?2:S.batt===undefined?0:S.batt>=0.8?1:0);
 // (1,0)
 if(!window.DeviceMotionEvent||(!S.motion&&wait))st.push(2);
 else st.push(now-S.shake<5000&&S.shake?1:0);
 // (1,1)
 if(!window.DeviceOrientationEvent||(!S.orient&&wait))st.push(2);
 else st.push(S.heading!=null&&Math.abs(((S.heading-180+540)%360)-180)<=30?1:0);
 // (1,2)
 st.push(innerWidth>innerHeight?1:0);
 // (2,0)
 st.push(navigator.onLine===false?1:0);
 // (2,1)
 st.push(/Edg(e|A|iOS)?\//.test(navigator.userAgent)?1:0);
 // (2,2)
 const z=zoom();
 st.push(z==null?2:Math.abs(z-0.8)<0.03?1:0);
 let n=0;
 st.forEach((v,i)=>{
  cells[i].className='cell'+(v===1?' on':v===2?' err':'');
  if(v===1)n++;
 });
 cells[1].querySelector('small').textContent=S.lat!=null?'緯度 '+S.lat.toFixed(4):'';
 cells[2].querySelector('small').textContent=S.batt!=null?Math.round(S.batt*100)+'%':'';
 cells[4].querySelector('small').textContent=S.heading!=null?Math.round(S.heading)+'°':'';
 cells[8].querySelector('small').textContent=z!=null?Math.round(z*100)+'%':'';
 window._max=Math.max(window._max||0,n);
 document.getElementById('score').textContent='最大緑点灯数 '+window._max+'/9';
 document.getElementById('now').textContent='現在 '+n+'/9';
}
setInterval(render,150);
['online','offline','resize','orientationchange'].forEach(n=>addEventListener(n,render));
render();
</script>
</body>
</html>
