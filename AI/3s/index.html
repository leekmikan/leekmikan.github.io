<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3秒チャレンジ</title>
<style>
:root{--bg:#f4f4f8;--fg:#1a1a24;--bar:#d9d9e6;--acc:#4f6bff;--tw:#000000;--ok:#1fa35a;--ng:#e04646;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141c;--fg:#f0f0f6;--bar:#33334a;--acc:#7a90ff}}
:root[data-theme="dark"]{--bg:#14141c;--fg:#f0f0f6;--bar:#33334a;--acc:#7a90ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.screen{display:none;height:100%;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box;gap:16px}
.screen.on{display:flex}
#game{justify-content:space-between}
h1{font-size:2rem;margin:0}
button{font-size:1.2rem;padding:14px 32px;border:0;border-radius:12px;background:var(--acc);color:#fff}
#btnTw{background: var(--tw);}
#top{width:100%}
#time{font-size:2rem;font-weight:700}
#meterWrap{height:14px;background:var(--bar);border-radius:7px;overflow:hidden;margin-top:8px}
#meter{height:100%;width:100%;background:var(--acc)}
#cmd{font-size:clamp(1.8rem,9vw,3rem);font-weight:800;line-height:1.3}
#lives{font-size:2.2rem;letter-spacing:6px}
#hint{font-size:1.4rem;margin-top:14px;opacity:.75;min-height:1.6em}
#score{font-size:1.25rem;opacity:.7}
.ok{color:var(--ok)}.ng{color:var(--ng)}
#note{font-size:.85rem;opacity:.7;max-width:320px}
</style>
</head>
<body>
<div id="start" class="screen on">
  <h1>3秒チャレンジ</h1>
  <div>表示される命令に3秒以内に従え!</div>
  <button id="btnStart">スタート</button>
  <div id="note"></div>
</div>
<div id="game" class="screen">
  <div id="top"><div id="time"></div><div id="meterWrap"><div id="meter"></div></div><div id="score"></div></div>
  <div id="center"><div id="cmd"></div><div id="hint"></div></div>
  <div id="lives"></div>
</div>
<div id="result" class="screen">
  <h1>ゲームオーバー</h1>
  <div id="resLevel"></div>
  <div style="font-size:1.4rem">スコア: <b id="resScore">0</b></div>
  <button id="btnTw" onclick="location.href='https://twitter.com/intent/tweet?text=' + G.score + '回成功した！%0Ahttps:%2F%2Fleekmikan.github.io%2FAI%2F3s%2Findex.html' ">結果をツイート</button>
  <button id="btnBack">最初に戻る</button>
</div>

<script>
/* =====================================================
 * 1. CONFIG ― バランス調整はここの数値だけ触ればOK
 * ===================================================== */
const CONFIG = {
  lives: 3,            // 初期ライフ
  startTime: 3.0,      // レベル開始時の制限時間(秒)
  timeStep: 0.1,       // クリアごとに減る秒数
  levelUpAt: 1.5,      // この制限時間をクリアしたらレベルアップ
  minTime: 0.5,        // 最大レベルで下がり続ける下限
  maxLevel: 3,         // 最大レベル
  resultDelay: 600,    // 判定表示の待ち時間(ms)
  inputGrace: 300,     // 「するな」系命令の開始直後の猶予(ms)
  shakeThreshold: 15,  // 「振る」成功の加速度(m/s²)
  stillThreshold: 3,   // 「動かすな」失敗の加速度(m/s²)
  flatTol: 15,         // 水平判定の許容角(度)
  uprightTol: 15,      // 垂直判定の許容角(度)
  headingTol: 22.5,       // 方角の許容誤差(度)
  tiltTol: 5,          // 傾きの許容誤差(度)
  tapRange: [1, 3],    // タップ回数の範囲
  tiltRange: [30, 90], // 傾ける角度の範囲
  tiltStep: 5,         // 傾ける角度の刻み
  compass: { 北: 0, 東: 90, 南: 180, 西: 270 },
  lifeIcon: '❤️', lostIcon: '🖤'
};

/* =====================================================
 * 2. COMMANDS ― 命令の追加はこの配列に1項目足すだけ
 *   levels : 出現するレベル
 *   setup  : ランダム値の決定(任意)
 *   text   : 表示文
 *   onTap / onMotion : 入力イベント(c.success() / c.fail() で即決着)
 *   check  : 時間切れ時の判定(trueで成功、未定義なら失敗)
 *   grace  : trueなら開始直後の入力を無視
 * ===================================================== */
const rand = (a, b, step = 1) => a + step * Math.floor(Math.random() * ((b - a) / step + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const angleDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const isFlat = () => S.tilt != null && S.tilt <= CONFIG.flatTol;
const DIR8 = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
const headingLabel = h => h == null ? '不明' : `${DIR8[Math.round(h / 45) % 8]}(${Math.round(h)}°)`;

const COMMANDS = [
  { id: 'tap', levels: [1], text: () => '画面をタップ',
    onTap: c => c.success() },
  { id: 'shake', levels: [1, 2, 3], text: () => 'スマホを振る',
    onMotion: (c, m) => { if (m > CONFIG.shakeThreshold) c.success(); } },
  { id: 'flat', levels: [1], text: () => 'スマホを置く',
    check: () => isFlat() },
  { id: 'upright', levels: [1], text: () => 'スマホを立てる',
    check: () => S.tilt != null && Math.abs(S.tilt - 90) <= CONFIG.uprightTol },
  { id: 'tapN', levels: [2, 3],
    setup: c => { c.n = rand(...CONFIG.tapRange); c.count = 0; },
    text: c => `画面を${c.n}回タップ`,
    onTap: c => { c.count++; if (c.count > c.n) c.fail(); },
    check: c => c.count === c.n,
    hint: c => `現在 ${c.count}回` },
  { id: 'heading', levels: [2, 3],
    setup: c => { c.dir = pick(Object.keys(CONFIG.compass)); },
    text: c => `スマホを${c.dir}へ向けて置く`,
    check: c => isFlat() && S.heading != null && angleDiff(S.heading, CONFIG.compass[c.dir]) <= CONFIG.headingTol,
    hint: () => `現在 ${headingLabel(S.heading)}` },
  { id: 'tilt', levels: [2, 3],
    setup: c => { c.deg = rand(CONFIG.tiltRange[0], CONFIG.tiltRange[1], CONFIG.tiltStep); },
    text: c => `スマホを水平から${c.deg}度傾けて保つ`,
    check: c => S.tilt != null && Math.abs(S.tilt - c.deg) <= CONFIG.tiltTol,
    hint: () => `現在 ${S.tilt == null ? '不明' : Math.round(S.tilt) + '度'}` },
  { id: 'noTap', levels: [3], grace: true, text: () => '画面をタップするな',
    onTap: c => c.fail(), check: () => true },
  { id: 'still', levels: [3], grace: true, text: () => 'スマホを動かすな',
    onMotion: (c, m) => { if (m > CONFIG.stillThreshold) c.fail(); }, check: () => true }
];

/* =====================================================
 * 3. SENSORS ― センサー値の取得
 * ===================================================== */
const S = { tilt: null, heading: null };
function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  S.tilt = Math.acos(Math.max(-1, Math.min(1, Math.cos(b) * Math.cos(g)))) * 180 / Math.PI; // 水平からの角度
  if (e.webkitCompassHeading != null) S.heading = e.webkitCompassHeading;
  else if ((e.absolute || e.type === 'deviceorientationabsolute') && e.alpha != null) S.heading = (360 - e.alpha) % 360;
}
function onMotion(e) {
  const a = e.acceleration, g = e.accelerationIncludingGravity;
  let m = 0;
  if (a && a.x != null) m = Math.hypot(a.x, a.y, a.z);
  else if (g && g.x != null) m = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.8);
  dispatch('onMotion', m);
}
addEventListener('deviceorientation', onOrientation);
addEventListener('deviceorientationabsolute', onOrientation);
addEventListener('devicemotion', onMotion);

/* =====================================================
 * 4. GAME ― ゲーム進行
 * ===================================================== */
const $ = id => document.getElementById(id);
const G = { level: 1, limit: 0, score: 0, lives: 0, cmd: null, ctx: null, t0: 0, running: false, last: null };

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function renderLives() { $('lives').textContent = CONFIG.lifeIcon.repeat(G.lives) + CONFIG.lostIcon.repeat(CONFIG.lives - G.lives); }
function renderScore() { $('score').textContent = `Lv.${G.level}　スコア ${G.score}`; }

function startGame() {
  Object.assign(G, { level: 1, limit: CONFIG.startTime, score: 0, lives: CONFIG.lives, last: null, running: false });
  renderLives(); renderScore();
  $('cmd').className = ''; $('cmd').textContent = 'よーい…';
  $('time').textContent = CONFIG.startTime.toFixed(1); $('meter').style.width = '100%';
  show('game');
  setTimeout(startRound, 900);
}

function renderHint() { $('hint').textContent = G.cmd && G.cmd.hint ? G.cmd.hint(G.ctx) : ''; }

function startRound() {
  const pool = COMMANDS.filter(c => c.levels.includes(G.level));
  let cmd = pick(pool);
  if (pool.length > 1) while (cmd === G.last) cmd = pick(pool);
  G.last = cmd; G.cmd = cmd;
  const ctx = { success: () => finish(true), fail: () => finish(false) };
  cmd.setup && cmd.setup(ctx);
  G.ctx = ctx;
  $('cmd').className = ''; $('cmd').textContent = cmd.text(ctx);
  renderHint();
  G.t0 = performance.now(); G.running = true;
  requestAnimationFrame(tick);
}

function tick(now) {
  if (!G.running) return;
  const remain = G.limit - (now - G.t0) / 1000;
  if (remain <= 0) {
    $('time').textContent = '0.0'; $('meter').style.width = '0%';
    finish(G.cmd.check ? !!G.cmd.check(G.ctx) : false);
    return;
  }
  $('time').textContent = remain.toFixed(1);
  renderHint();
  $('meter').style.width = (remain / G.limit * 100) + '%';
  requestAnimationFrame(tick);
}

function dispatch(type, arg) {
  if (!G.running || !G.cmd || !G.cmd[type]) return;
  if (G.cmd.grace && performance.now() - G.t0 < CONFIG.inputGrace) return;
  G.cmd[type](G.ctx, arg);
}

function finish(ok) {
  if (!G.running) return;
  G.running = false;
  $('cmd').className = ok ? 'ok' : 'ng';
  $('cmd').textContent = ok ? '⭕ OK!' : '❌ ミス';
  $('hint').textContent = '';
  if (ok) {
    G.score++;
    if (G.limit <= CONFIG.levelUpAt + 1e-6 && G.level < CONFIG.maxLevel) { G.level++; G.limit = CONFIG.startTime; }
    else G.limit = Math.max(CONFIG.minTime, Math.round((G.limit - CONFIG.timeStep) * 10) / 10);
  } else {
    G.lives--;
  }
  renderLives(); renderScore();
  setTimeout(() => {
    if (G.lives <= 0) gameOver(); else startRound();
  }, CONFIG.resultDelay);
}

function gameOver() {
  $('resScore').textContent = G.score;
  $('resLevel').textContent = `到達レベル ${G.level}`;
  show('result');
}

/* =====================================================
 * 5. UI イベント
 * ===================================================== */
$('game').addEventListener('pointerdown', () => dispatch('onTap'));
$('btnBack').addEventListener('click', () => show('start'));
$('btnStart').addEventListener('click', async () => {
  try {
    for (const API of [window.DeviceMotionEvent, window.DeviceOrientationEvent]) {
      if (API && typeof API.requestPermission === 'function') await API.requestPermission();
    }
  } catch (e) { $('note').textContent = 'センサーの許可が得られませんでした。センサー命令は失敗扱いになります。'; }
  if (!('DeviceMotionEvent' in window)) $('note').textContent = 'センサー非対応の環境です(タップ命令のみ有効)。';
  startGame();
});
</script>
</body>
</html>
