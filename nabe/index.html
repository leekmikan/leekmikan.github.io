<body>

    <main class="calculator">
        <h1>【高速版】ナベアツのアホになる回数計算</h1>

        <p class="description">
            指定した自然数まで数えたときの「アホになる」回数と割合を<br>
            ナベアツ方程式を応用して高速で計算します。<br><br>
            
            通常の数え上げと比較すると、計算量は O(n)→O(log(n)) になります。<br>
			
			BigIntを使用しているので、メモリとPCの性能の許す範囲で<br>
			数百数千桁の数字で計算出来ます。<br><br>
			
			ソースコードは、自作のものをAIにアルゴリズムを保ちつつ<br>
			見やすく書き換えてもらいました。<br>
			
			詳しい内容はココ→<a href="https://note.com/leekmikan/n/ncd4030000a98">note</a><br>
			Twitter(X)垢→<a href="https://x.com/mirilelumeka">&#xA66E;&#xA66E;&#xA66E;</a><br>
        </p>

        <label for="numberInput">
            自然数
            <input
                type="number"
                id="numberInput"
                min="1"
                placeholder="例：20070831"
            >
        </label>

        <button id="calculateButton">
            計算する
        </button>

        <p id="result"></p>
    </main>

    <script src="main.js" type="text/javascript" charset="utf-8"></script>

</body>
</html>
